<body>

<header class="site-header">
  <div class="header-inner">
    <a href="index.html" class="logo">
      <span class="logo-icon">🚛</span>

    <nav class="header-nav">
      <a href="index.html">홈</a>
      <a href="wrong-notes.html">오답노트</a>
    </nav>
  </div>
</header>

<main>
  <div class="page-with-sidebar" style="max-width:820px;">
    <div class="gosa-main">

      <h1 id="previewTitle" style="font-size:1.25rem;font-weight:800;color:var(--navy);margin:1.25rem 0 1rem;">PDF 미리보기</h1>

      <!-- 광고 (미리보기 위) -->
      <div class="ad-slot" style="margin-bottom:1.5rem;">
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-6464921081676309"
             data-ad-slot="1419180025"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
        <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>
      </div>

      <div id="pdfPreviewList"></div>

      <div class="sel-count-bar" style="justify-content:center;">
        <button class="btn btn-primary btn-lg" id="dlAllBtn">📥 PDF 다운로드</button>
      </div>

    </div>
  </div>
</main>

<footer class="site-footer">

  </div>
</footer>

<script>
(function () {
  const params = new URLSearchParams(location.search);
  const files = params.getAll('f');
  const kinds = params.getAll('k');
  const name = params.get('name') || '';
  const round = params.get('round') || '';

  function escapeHtml(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  const titleText = [name, round, 'PDF 미리보기'].filter(Boolean).join(' ');
  document.title = titleText + ' - 우아고사';
  document.getElementById('previewTitle').textContent = titleText;

  const listEl = document.getElementById('pdfPreviewList');
  const dlAllBtn = document.getElementById('dlAllBtn');

  if (!files.length) {
    listEl.innerHTML = '<p>표시할 PDF가 없습니다.</p>';
    dlAllBtn.disabled = true;
    dlAllBtn.classList.add('btn-disabled');
  } else {
    listEl.innerHTML = files.map(function (f, i) {
      const kind = kinds[i] || ('파일 ' + (i + 1));
      return '<div class="pdf-preview-item">' +
        '<div class="pdf-preview-label">📄 ' + escapeHtml(kind) + '</div>' +
        '<iframe class="pdf-preview-frame" src="' + encodeURI(f) + '#toolbar=0" loading="lazy" title="' + escapeHtml(kind) + ' 미리보기"></iframe>' +
        '</div>';
    }).join('');
  }

  dlAllBtn.addEventListener('click', function () {
    files.forEach(function (f, i) {
      setTimeout(function () {
        const a = document.createElement('a');
        a.href = encodeURI(f);
        a.download = '';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
      }, i * 400);
    });
  });
})();
</script>
<script src="js/ad-dev-placeholder.js"></script>

</body>
</html>
